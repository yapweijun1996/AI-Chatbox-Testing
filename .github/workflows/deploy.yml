name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Stamp service worker cache version with commit SHA
        run: |
          grep -q "__BUILD_SHA__" sw.js || { echo "::error::__BUILD_SHA__ placeholder not found in sw.js"; exit 1; }
          sed -i "s/__BUILD_SHA__/${GITHUB_SHA}/g" sw.js
          echo "Stamped sw.js -> cosmic-chat-${GITHUB_SHA}"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
